# ===========================================================================
# SonarScanner Configuration — ExoDeck
# ===========================================================================

# Project identification
sonar.projectKey=exodeck
sonar.projectName=ExoDeck

# SonarQube Server
sonar.host.url=http://localhost:9000

# Source code encoding
sonar.sourceEncoding=UTF-8

# Source and test locations
sonar.sources=.
sonar.tests=.

# Test file inclusions
sonar.test.inclusions=**/*_test.go

# Exclusions from code analysis
# Excludes third-party vendor assets, dependencies, build artifacts, binaries, and local data
sonar.exclusions=\
  frontend/**,\
  node_modules/**,\
  dist/**,\
  build/**,\
  data/**,\
  prompts/**,\
  **/*.syso,\
  **/*.exe,\
  **/*_test.go,\
  coverage,\
  coverage.out,\
  config.json

# Exclusions from duplication detection
sonar.cpd.exclusions=\
  frontend/vendor/**,\
  **/*_test.go

# Go coverage and test reports (generated e.g. via: go test ./... -coverprofile=coverage.out)
sonar.go.coverage.reportPaths=coverage.out
