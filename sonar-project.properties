# ===========================================================================
# SonarCloud Configuration — ExoDeck
# ===========================================================================

# Project identification
sonar.projectKey=ExoDeck_exodeck
sonar.organization=exodeck
sonar.projectName=ExoDeck

# SonarCloud Server
sonar.host.url=https://sonarcloud.io

# Source code encoding
sonar.sourceEncoding=UTF-8

# Source and test locations
sonar.sources=.
sonar.tests=.

# Test file inclusions
sonar.test.inclusions=**/*_test.go

# Exclusions from code analysis
# Excludes third-party vendor assets, dependencies, scripts, build artifacts, binaries, and local data
sonar.exclusions=\
  frontend/**,\
  node_modules/**,\
  dist/**,\
  build/**,\
  data/**,\
  prompts/**,\
  docs/**,\
  scripts/**,\
  .github/**,\
  *.ps1,\
  *.js,\
  *.py,\
  **/*.syso,\
  **/*.exe,\
  **/*_test.go,\
  coverage,\
  coverage.out,\
  config.json,\
  config.json.example

# Exclusions from code coverage calculation
# Excludes entry points, version constants, embedded FS, and platform-specific stubs
sonar.coverage.exclusions=\
  main.go,\
  main_windows.go,\
  **/*_windows.go,\
  **/*_unix.go,\
  version.go,\
  embed.go

# Exclusions from duplication detection
sonar.cpd.exclusions=\
  frontend/vendor/**,\
  **/*_test.go

# Go coverage and test reports (generated via: go test ./internal/... . -coverprofile=coverage.out)
sonar.go.coverage.reportPaths=coverage.out
